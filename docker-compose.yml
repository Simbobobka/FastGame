version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # app:
  #   build:
  #     context: ./FastGame
  #     dockerfile: Dockerfile
  #   command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
  #   volumes:
  #     - ./FastGame:/app
  #   ports:
  #     - "8002:8000"
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  playwright:
    build:
      context: ./Scrapers
      dockerfile: Dockerfile.playwright
    init: true
    ipc: host
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 3000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  scrapers:
    build:
      context: ./Scrapers
      dockerfile: Dockerfile.scraper
    volumes:
      - ./Scrapers:/app
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_WS_ENDPOINT=ws://playwright:3000/
      - WEB_URL=http://web:8000
    depends_on:
      postgres:
        condition: service_healthy
      playwright:
        condition: service_healthy

volumes:
  db_data: