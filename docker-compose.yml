version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    env_file: ./.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --user ${REDIS_USER} on >${REDIS_USER_PASSWORD} ~* +@all 
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  app:
    build:
      context: ./FastGame
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./FastGame:/app
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  playwright:
    build:
      context: ./Scrapers
      dockerfile: Dockerfile.playwright
    init: true
    ipc: host
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 3000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./FastGame
      dockerfile: Dockerfile
    image: fastgame_celery_worker
    command: /start-celeryworker
    volumes:
      - ./FastGame:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: ./FastGame
      dockerfile: Dockerfile
    image: fastgame_celery_beat
    command: /start-celerybeat
    volumes:
      - ./FastGame:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
  
  flower:
    build:
      context: ./FastGame
      dockerfile: Dockerfile
    image: fastgame_celery_flower
    command: /start-flower
    volumes:
      - ./FastGame:/app
    env_file:
      - .env
    ports:
      - 5557:5555
    depends_on:
      - redis
      - postgres

  scrapers:
    build:
      context: ./Scrapers
      dockerfile: Dockerfile.scraper
    volumes:
      - ./Scrapers:/app
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_WS_ENDPOINT=ws://playwright:3000/
      - WEB_URL=http://app:8000
      - DJANGO_API=http://app:8000
    depends_on:
      postgres:
        condition: service_healthy
      playwright:
        condition: service_healthy

volumes:
  db_data:
  redis_data: